version: 2
updates:
  # Rust workspace crates (all workspace members)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      workspace:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # arpui - standalone Rust crate (non-workspace)
  - package-ecosystem: "cargo"
    directory: "/arpui"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      arpui:
        patterns:
          - "*"
    open-pull-requests-limit: 5
