name = "arpeggio-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2023-03-22"
# logpush = true
preview_urls = false

[build]
command = "node ./build.js"

[durable_objects]
bindings = [
  { name = "ARPEGGIOGAME", class_name = "ArpeggioGameSql" },
  { name = "PREPROD_ARPEGGIOGAME", class_name = "ArpeggioGameSql", script_name = "arpeggio-backend-preprod" }
]

[exports.ArpeggioGameSql]
type = "durable-object"
storage = "sqlite"

[vars]
GOOGLE_CLIENT_ID = "328154234071-c7una5er0n385sdgvih81ngbkgp1l7nj.apps.googleusercontent.com"
CF_ACCOUNT_ID = "9da1987464827a8209f127a4e0f02b77"
CF_IMAGE_DELIVERY_PREFIX = "https://arpeggiogame.com/cdn-cgi/imagedelivery/0DU4Tw-CmEbMyEuTLNg6Xg/"
FRONTEND_URL = "http://arpeggiogame.com"
FRONTEND_ALLOWED_ORIGINS = "https://arpeggiogame.com,https://dioxus.arpeggio-331.pages.dev"

[secrets]
required = ["GOOGLE_CLIENT_SECRET", "CF_IMAGES_TOKEN", "CF_API_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "arpeggio-users"
database_id = "9bbbb737-cabc-44cb-bd76-44c3a5625759"

[env.preprod]
workers_dev = true
preview_urls = false

[env.preprod.durable_objects]
bindings = [
  { name = "ARPEGGIOGAME", class_name = "ArpeggioGameSql" },
  { name = "PRODUCTION_ARPEGGIOGAME", class_name = "ArpeggioGameSql", script_name = "arpeggio-backend" }
]

[env.preprod.exports.ArpeggioGameSql]
type = "durable-object"
storage = "sqlite"

[env.preprod.vars]
GOOGLE_CLIENT_ID = "328154234071-c7una5er0n385sdgvih81ngbkgp1l7nj.apps.googleusercontent.com"
CF_ACCOUNT_ID = "9da1987464827a8209f127a4e0f02b77"
CF_IMAGE_DELIVERY_PREFIX = "https://arpeggiogame.com/cdn-cgi/imagedelivery/0DU4Tw-CmEbMyEuTLNg6Xg/"
FRONTEND_URL = "https://preprod.arpeggio-331.pages.dev"
FRONTEND_ALLOWED_ORIGINS = "https://preprod.arpeggio-331.pages.dev"

[env.preprod.secrets]
required = ["GOOGLE_CLIENT_SECRET", "CF_IMAGES_TOKEN", "CF_API_TOKEN"]

[[env.preprod.d1_databases]]
binding = "DB"
database_name = "arpeggio-users-preprod"
database_id = "e69f6947-b1cb-45ab-b91d-1b5dc0ad2cc8"
