[workspace]
members = [
    "foldertree",
    "indexed",
    "nonempty",
    "arpeggio",
    "arpeggio-server",
    "arptypes",
]
exclude = ["arpui", "arp3d"]
resolver = "2"

[workspace.lints.clippy]
unnecessary_lazy_evaluations = "allow"

[workspace.dependencies]
anyhow = { version = "1.0.75", features = ["backtrace"] }
derive_more = { version = "2", features = ["add", "mul", "display"] }
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.1.2", features = ["v4", "v5", "serde"] }
once_cell = "1.18.0"
strum = { version = "0.28.0", features = ["derive"] }
percent-encoding = "2.3.0"
thiserror = "2.0.18"
tracing = { version = "0.1.37", features = ["attributes"] }
num = "0.4"
num-traits = "0.2.10"
ts-rs = { version = "12.0.1", features = ["serde-compat", "uuid-impl"] }
# Member crates enable the `js` feature when they compile for WASM.
getrandom = { version = "0.2.9" }

[workspace.dependencies.uom]
version = "0.38"
default-features = false
features = ["u32", "i64", "serde", "si"]

[profile.release]
lto = true
codegen-units = 1
